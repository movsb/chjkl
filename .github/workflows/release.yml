name: Package Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate version and architecture
        shell: bash
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "CHJKL_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build and verify App
        shell: bash
        run: |
          ./scripts/build.sh
          lipo build/Chjkl.app/Contents/MacOS/Chjkl -verify_arch arm64
          codesign --verify --deep --strict build/Chjkl.app

      - name: Package download
        shell: bash
        run: |
          mkdir -p dist
          archive="Chjkl-${RELEASE_TAG}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Chjkl.app "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > SHA256SUMS.txt

      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --verify-tag --title "Chjkl $RELEASE_TAG" --generate-notes
          fi
